<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SPORTIFY</title>
    <!-- Masuk ke folder frontend untuk memanggil CSS -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <!-- Tombol Kembali ke Beranda -->
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Kembali</a>

    <!-- Container Form Login -->
    <div class="login-container">
        <div class="login-header">
            <h2>SPORTIFY.</h2>
            <p>Masuk ke akun Anda untuk melanjutkan</p>
        </div>
        
        <form id="form-login" class="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Masukkan username admin / user" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 login-btn">Masuk</button>
            
            <div class="login-footer">
                <p>Belum punya akun? <a href="#">Daftar sekarang</a></p>
            </div>
        </form>
    </div>

    <!-- Masuk ke folder frontend untuk memanggil JS -->
    <script src="frontend/assetss/js/auth.js"></script>
</body>
</html>
