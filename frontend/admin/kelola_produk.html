<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Katalog | SPORTIFY Admin</title>
    <link rel="stylesheet" href="../assetss/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">SPORTIFY. Admin</div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="kelola_produk.html" class="active"><i class="fas fa-box"></i> Kelola Katalog</a></li>
            <li><a href="kelola_diskon.html"><i class="fas fa-tags"></i> Kelola Diskon</a></li>
            <li><a href="#" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Keluar</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <h2>Katalog Produk</h2>
        </header>

        <section class="crud-area">
            <div class="action-bar">
                <button class="btn btn-tambah" id="btn-tambah-produk"><i class="fas fa-plus"></i> Tambah Produk</button>
            </div>
            <div class="table-container">
                <table class="table-produk">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Produk</th>
                            <th>Stok</th>
                            <th>Harga</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-produk">
                        <tr><td colspan="5" style="text-align: center;">Memuat data produk...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Form Produk -->
    <div class="modal-overlay" id="modal-produk">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title-produk">Tambah Produk Baru</h3>
                <button class="close-modal" id="btn-tutup-produk"><i class="fas fa-times"></i></button>
            </div>
            <form id="form-produk">
                <input type="hidden" id="produk-id">
                <div class="form-group"><label>Nama Produk</label><input type="text" id="nama-produk" required></div>
                <div class="form-group"><label>Harga (Rp)</label><input type="number" id="harga-produk" required></div>
                <div class="form-group"><label>Stok</label><input type="number" id="stok-produk" required></div>
                <!-- Perbaikan: required dihilangkan pada input file -->
                <div class="form-group"><label>Gambar (File)</label><input type="file" id="gambar-produk" accept="image/*"></div>
                <button type="submit" class="btn btn-simpan">Simpan Data</button>
            </form>
        </div>
    </div>

    <script src="../assetss/js/admin.js"></script>
</body>
</html>
